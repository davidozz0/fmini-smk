# SPDX-License-Identifier: GPL-3.0-only
# FMini-1 for the SMK-37: builds the port and publishes its web installer on GitHub Pages, at
# https://davidozz0.github.io/fmini-smk/ — on every push to `smk37`, so the page always serves the last
# build. It pushes the regenerated site (web/make_site.py) to `gh-pages`, so the repository's Pages source
# stays "Deploy from a branch: gh-pages"; no other setting to change.
name: Installer

on:
  push:
    branches: [smk37]
    paths: ["firmware/**", "web/**", "tools/**", "assets/**", "build.sh", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow fonttools

      - name: JieLi toolchain and AC79 SDK
        run: |
          tools/get_toolchain.sh
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"

      - name: Build the SMK-37 port
        run: |
          BOARD=smk37 ./build.sh
          BOARD=smk37 MODEL=elite ./build.sh
          BOARD=smk37 MODEL=mke ./build.sh

      - name: Web tests
        run: node web/test_web.mjs

      - name: Make the site
        id: site
        run: |
          VERSION=$(sed -n 's/^#define FMINI_VERSION "v\(.*\)"/\1/p' firmware/src/core.h)
          echo "version=$VERSION-smk37" >> "$GITHUB_OUTPUT"
          python3 web/make_site.py _site "$VERSION-smk37" \
              build/fmini-1-smk37.fwsc build/fmini-1-smk37-elite.fwsc build/fmini-1-smk37-mke.fwsc

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages /tmp/site origin/gh-pages
          rm -rf /tmp/site/index.html /tmp/site/webapp /tmp/site/firmware   # what make_site.py writes
          cp -r _site/. /tmp/site/
          cd /tmp/site
          git add -A
          git diff --cached --quiet || git commit -m "site: ${{ steps.site.outputs.version }}"
          git push origin HEAD:gh-pages
